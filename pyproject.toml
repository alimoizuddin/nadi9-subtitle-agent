[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nadi9"
version = "0.1.0"
description = "Evidence-grounded subtitle agent for a fictional dialect"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["anthropic>=0.40"]
test = ["pytest>=8"]

[project.scripts]
nadi9 = "nadi9.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
